name: Daily AI briefing

on:
  schedule:
    # 07:30 India Standard Time. GitHub scheduled runs may start a little later.
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-ai-briefing
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Research and generate briefing
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.1
        run: python scripts/generate_briefing.py

      - name: Commit generated edition
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ai-briefing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data

          if git diff --cached --quiet; then
            echo "No briefing changes to commit."
            exit 0
          fi

          EDITION_DATE="$(TZ=Asia/Kolkata date +%F)"
          git commit -m "Update AI briefing ${EDITION_DATE}"
          git push
